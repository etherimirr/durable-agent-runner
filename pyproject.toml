[project]
name = "durable-agent-runner"
version = "0.1.0"
description = "An analysis agent on a durable task runner: LangGraph state machine, MCP tools, leased workers, checkpointed steps, React panel."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=3.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "anthropic>=2.0"]
llm = ["anthropic>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
dar = ["panel.html"]
harness = ["steps/*.py"]
